<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple To-Do List</title>
  <style>
    :root{
      --bg: #0f1724;
      --card: #0b1220;
      --muted: #97a0b3;
      --accent: #7c5cff;
      --accent-2: #4dd0e1;
      --glass: rgba(255,255,255,0.04);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, system-ui;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(124,92,255,0.12), transparent),
                  radial-gradient(900px 500px at 90% 90%, rgba(77,208,225,0.06), transparent),
                  var(--bg);
      color:#e6eef8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
      overflow-x: hidden;
    }

    .container{
      width:100%;
      max-width:720px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      border-radius:14px;
      padding:28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.04);
      position: relative;
      z-index: 1;
    }

    header{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:18px;
    }

    header h1{
      margin:0;
      font-size:20px;
      letter-spacing:0.2px;
    }
    header p{margin:0; color:var(--muted); font-size:13px}

    .add-row{
      display:flex;
      gap:12px;
      margin-bottom:18px;
    }

    .add-row input[type="text"]{
      flex:1;
      padding:12px 14px;
      background:var(--glass);
      border:1px solid rgba(255,255,255,0.03);
      border-radius:10px;
      color:inherit;
      outline:none;
      font-size:15px;
    }

    .btn{
      background:linear-gradient(180deg,var(--accent), #5a3ce6);
      border:none;
      color:white;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
      letter-spacing:0.2px;
      box-shadow: 0 6px 18px rgba(124,92,255,0.14);
    }

    .list{
      list-style:none;
      padding:0;
      margin:0;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .item{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px;
      border-radius:10px;
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.03);
    }

    .checkbox{
      width:18px;
      height:18px;
      border-radius:6px;
      display:inline-grid;
      place-items:center;
      cursor:pointer;
      border:1px solid rgba(255,255,255,0.06);
    }

    .label{
      flex:1;
      font-size:15px;
      word-break:break-word;
    }

    .label.completed{
      text-decoration:line-through;
      opacity:0.6;
    }

    .small{
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      padding:6px 8px;
      border-radius:8px;
      color:var(--muted);
      font-size:13px;
      cursor:pointer;
    }

    .filters{
      display:flex;
      gap:8px;
      align-items:center;
      margin-top:14px;
    }

    .filters .chip{
      padding:8px 10px;
      border-radius:999px;
      font-size:13px;
      cursor:pointer;
      border:1px solid rgba(255,255,255,0.03);
      color:var(--muted);
    }

    .filters .chip.active{
      color:var(--bg);
      background:linear-gradient(90deg,var(--accent-2),var(--accent));
      font-weight:700;
      border:none;
    }

    .meta{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:14px;
      color:var(--muted);
      font-size:13px;
    }

    /* 🔥 Small Floating Minion */
    .minion{
      position: fixed;
      bottom: 15px;
      right: 15px;
      cursor: pointer;
      text-align: center;
      animation: float 3s ease-in-out infinite;
      z-index: 10;
    }

    .minion img{
      width: 200px;
      border-radius: 50px;
    }

    .speech{
      background: white;
      color: black;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      margin-bottom: 4px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    @keyframes float{
      0%,100%{ transform: translateY(0px); }
      50%{ transform: translateY(-6px); }
    }

    /* Fullscreen Minion Pop-up */
    .minion-overlay{
      position: fixed;
      top:0;
      left:0;
      width:100vw;
      height:100vh;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-size: 20px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      overflow: hidden;
    }

    .minion-overlay.active{
      opacity:1;
      pointer-events: auto;
    }

    .minion-overlay img{
      max-width: 400px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .minion-overlay .close-btn{
      background: var(--accent);
      border:none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 12px;
      cursor:pointer;
      color:white;
      font-weight:600;
    }

    /* ❤️ Falling Hearts */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      transform: rotate(-45deg);
      animation: fall linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      border-radius: 50%;
    }

    .heart::before { top: -10px; left: 0; }
    .heart::after { left: 10px; top: 0; }

    @keyframes fall {
      0% { transform: translateY(-50px) rotate(-45deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(-45deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div style="width:52px; height:52px; border-radius:12px; overflow:hidden;">
        <img src="v3.jpeg" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div>
        <h1>Watch list</h1>
        <p>Mga dapat panoodin ngayong araw</p>
      </div>
    </header>

    <div class="add-row">
      <input id="taskInput" type="text" placeholder="Add here." />
      <button id="addBtn" class="btn">Add</button>
    </div>

    <ul id="todoList" class="list"></ul>

    <div class="filters">
      <div class="chip active" data-filter="all">All</div>
      <div class="chip" data-filter="active">Active</div>
      <div class="chip" data-filter="completed">Completed</div>
    </div>

    <div class="meta">
      <div id="count">0 tasks</div>
      <div style="display:flex;gap:8px;">
        <button id="clearCompleted" class="small">Clear completed</button>
        <button id="clearAll" class="small">Clear all</button>
      </div>
    </div>
  </div>

  <!-- Minion -->
  <div class="minion" id="minion">
    <div class="speech">Click me!</div>
    <img src="minion-removebg-preview.png">
  </div>

  <!-- Minion Fullscreen Overlay -->
  <div class="minion-overlay" id="minionOverlay">
    <img src="https://media1.tenor.com/m/kutFNFXxSIsAAAAd/minion-minion-loves.gif" alt="Minion">
    <p>Happy valentine :) the chocolates are in my locker (84) no password</p>
    <button class="close-btn" id="closeOverlay">Close</button>
  </div>

  <script>
    const input = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const list = document.getElementById('todoList');
    const countEl = document.getElementById('count');
    const clearCompleted = document.getElementById('clearCompleted');
    const clearAll = document.getElementById('clearAll');

    let tasks = [];
    let filter = "all";

    function render(){
      localStorage.setItem("tasks", JSON.stringify(tasks));
      list.innerHTML = "";

      const visible = tasks.filter(t => {
        if(filter === "all") return true;
        if(filter === "active") return !t.done;
        if(filter === "completed") return t.done;
      });

      visible.forEach((t, idx) => {
        const li = document.createElement("li");
        li.className = "item";

        const cb = document.createElement("div");
        cb.className = "checkbox";
        cb.innerHTML = t.done ? "✔" : "";
        cb.addEventListener("click", () => toggleDone(idx));

        const label = document.createElement("div");
        label.className = "label" + (t.done ? " completed" : "");
        label.textContent = t.text;

        const del = document.createElement("button");
        del.className = "small";
        del.textContent = "Delete";
        del.addEventListener("click", () => removeTask(idx));

        li.appendChild(cb);
        li.appendChild(label);
        li.appendChild(del);

        list.appendChild(li);
      });

      const remaining = tasks.filter(t => !t.done).length;
      countEl.textContent = `${remaining} task${remaining === 1 ? "" : "s"} left`;
    }

    function addTask(text){ const trimmed = text.trim(); if(!trimmed) return; tasks.unshift({ text: trimmed, done: false }); input.value = ""; render(); }
    function toggleDone(i){ tasks[i].done = !tasks[i].done; render(); }
    function removeTask(i){ tasks.splice(i,1); render(); }

    addBtn.addEventListener("click", () => addTask(input.value));
    input.addEventListener("keypress", e => { if(e.key === "Enter") addTask(input.value); });

    clearCompleted.addEventListener("click", () => { tasks = tasks.filter(t => !t.done); render(); });
    clearAll.addEventListener("click", () => { tasks = []; render(); });

    const saved = localStorage.getItem("tasks");
    tasks = saved ? JSON.parse(saved) : [];
    render();

    // Minion overlay & hearts
    const minion = document.getElementById("minion");
    const overlay = document.getElementById("minionOverlay");
    const closeBtn = document.getElementById("closeOverlay");

    let heartsInterval;

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * 100 + "vw";
      const duration = 5 + Math.random() * 5;
      heart.style.animationDuration = duration + "s";
      const size = 10 + Math.random() * 20;
      heart.style.width = size + "px";
      heart.style.height = size + "px";
      heart.style.opacity = Math.random();
      overlay.appendChild(heart);

      setTimeout(() => heart.remove(), duration * 1000);
    }

    minion.addEventListener("click", () => {
      overlay.classList.add("active");
      // Start hearts animation
      heartsInterval = setInterval(createHeart, 300);
    });

    closeBtn.addEventListener("click", () => {
      overlay.classList.remove("active");
      // Stop hearts animation
      clearInterval(heartsInterval);
      // Remove remaining hearts
      overlay.querySelectorAll(".heart").forEach(h => h.remove());
    });
  </script>
</body>
</html>
