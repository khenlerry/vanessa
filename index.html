<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Watch List</title>

<style>
:root{
  --bg:#0f1724;
  --accent:#7c5cff;
  --accent2:#4dd0e1;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter,system-ui;
  background:var(--bg);
  color:#e6eef8;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
  overflow:hidden;
}

/* 🌌 Animated Stars Background */
.stars{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  background-image:radial-gradient(white 1px, transparent 1px);
  background-size:50px 50px;
  opacity:0.08;
  animation:moveStars 60s linear infinite;
}
@keyframes moveStars{
  from{background-position:0 0;}
  to{background-position:1000px 1000px;}
}

.container{
  width:100%;
  max-width:720px;
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(12px);
  border-radius:14px;
  padding:28px;
  position:relative;
  z-index:2;
  box-shadow:0 0 40px rgba(124,92,255,0.3);
}

header{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:18px;
}

header h1{margin:0;font-size:20px}
header p{margin:0;color:#97a0b3;font-size:13px}

.add-row{
  display:flex;
  gap:12px;
  margin-bottom:18px;
}

.add-row input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,0.06);
  color:white;
  outline:none;
}

.btn{
  background:linear-gradient(180deg,var(--accent),#5a3ce6);
  border:none;
  padding:10px 14px;
  border-radius:10px;
  color:white;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 15px rgba(124,92,255,0.6);
}

.list{
  list-style:none;
  padding:0;
  margin:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  max-height:300px;
  overflow-y:auto;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
}

.checkbox{
  width:18px;
  height:18px;
  border-radius:6px;
  border:1px solid rgba(255,255,255,0.4);
  cursor:pointer;
  display:grid;
  place-items:center;
}

.label.completed{
  text-decoration:line-through;
  opacity:0.5;
}

.small{
  background:transparent;
  border:1px solid rgba(255,255,255,0.3);
  padding:6px 8px;
  border-radius:8px;
  color:#97a0b3;
  cursor:pointer;
}

.meta{
  display:flex;
  justify-content:space-between;
  margin-top:14px;
  font-size:13px;
  color:#97a0b3;
}

/* 🐣 Hidden Minion */
.minion{
  position:fixed;
  bottom:20px;
  right:20px;
  display:none;
  cursor:pointer;
  animation:float 3s ease-in-out infinite;
  z-index:5;
}
.minion img{
  width:160px;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* Overlay */
.minion-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  overflow:hidden;
  z-index:10;
}
.minion-overlay.active{
  opacity:1;
  pointer-events:auto;
}
.minion-overlay img{
  max-width:350px;
  border-radius:20px;
  margin-bottom:20px;
}
.close-btn{
  background:var(--accent);
  border:none;
  padding:10px 20px;
  border-radius:12px;
  color:white;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 20px rgba(124,92,255,0.8);
}

/* 💜 Falling Hearts */
.heart{
  position:absolute;
  width:20px;
  height:20px;
  background:#7c5cff;
  transform:rotate(-45deg);
  animation:fall linear infinite;
  box-shadow:0 0 12px rgba(124,92,255,0.8);
}
.heart::before,
.heart::after{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  background:#7c5cff;
  border-radius:50%;
}
.heart::before{top:-10px;left:0}
.heart::after{left:10px;top:0}

@keyframes fall{
  0%{transform:translateY(-50px) rotate(-45deg);opacity:1}
  100%{transform:translateY(110vh) rotate(-45deg);opacity:0}
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
<header>
<div style="width:52px;height:52px;border-radius:12px;overflow:hidden;">
<img src="v3.jpeg" style="width:100%;height:100%;object-fit:cover;">
</div>
<div>
<h1>Watch list</h1>
<p>Mga dapat panoodin ngayong araw</p>
</div>
</header>

<div class="add-row">
<input id="taskInput" type="text" placeholder="Add here." />
<button id="addBtn" class="btn">Add</button>
</div>

<ul id="todoList" class="list"></ul>

<div class="meta">
<div id="count">0 tasks</div>
</div>
</div>

<div class="minion" id="minion">
<img src="minion-removebg-preview.png">
</div>

<!-- Overlay with fixed message -->
<div class="minion-overlay" id="overlay">
<img src="https://media1.tenor.com/m/kutFNFXxSIsAAAAd/minion-minion-loves.gif">
<p>
  Happy Valentine :)<br>
  The chocolates are in locker 84 🍫✨
</p>
<button class="close-btn" id="closeBtn">Close</button>
</div>

<script>
const input=document.getElementById("taskInput");
const addBtn=document.getElementById("addBtn");
const list=document.getElementById("todoList");
const countEl=document.getElementById("count");
const minion=document.getElementById("minion");
const overlay=document.getElementById("overlay");
const closeBtn=document.getElementById("closeBtn");

let tasks=[];
let heartsInterval;

function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.style.left=Math.random()*100+"vw";
  const duration=5+Math.random()*5;
  heart.style.animationDuration=duration+"s";
  overlay.appendChild(heart);
  setTimeout(()=>heart.remove(),duration*1000);
}

function render(){
  list.innerHTML="";
  tasks.forEach((t,i)=>{
    const li=document.createElement("li");
    li.className="item";
    const cb=document.createElement("div");
    cb.className="checkbox";
    cb.innerHTML=t.done?"✔":"";
    cb.onclick=()=>{t.done=!t.done;render();}
    const label=document.createElement("div");
    label.className="label"+(t.done?" completed":"");
    label.textContent=t.text;
    li.append(cb,label);
    list.appendChild(li);
  });
  countEl.textContent=tasks.length+" tasks";
}

function addTask(text){
  const trimmed=text.trim();
  if(!trimmed) return;

  if(trimmed.toLowerCase()==="vanessa"){
    minion.style.display="block";
    input.value="";
    return;
  }

  tasks.unshift({text:trimmed,done:false});
  input.value="";
  render();
}

addBtn.onclick=()=>addTask(input.value);
input.addEventListener("keypress",e=>{if(e.key==="Enter")addTask(input.value);});

/* Minion click shows fixed message and hearts */
minion.onclick=()=>{
  overlay.classList.add("active");
  heartsInterval=setInterval(createHeart,300);
};

closeBtn.onclick=()=>{
  overlay.classList.remove("active");
  clearInterval(heartsInterval);
  overlay.querySelectorAll(".heart").forEach(h=>h.remove());
};

render();
</script>

</body>
</html>
